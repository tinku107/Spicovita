<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 280" width="190mm" height="280mm">
  <defs>
    <!-- Fonts & Styles -->
    <style>
      .brand-title { font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; font-weight: 900; font-size: 15px; }
      .brand-vita { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-style: italic; font-size: 15px; }
      .tagline { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; font-size: 4.2px; letter-spacing: 1.6px; }
      .prod-sub { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; font-size: 4.8px; letter-spacing: 1.2px; text-transform: uppercase; }
      .prod-name { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 10.5px; }
      .badge-txt { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; font-size: 3.6px; }
      .qty-lbl { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; font-size: 3.8px; }
      .qty-val { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 900; font-size: 7.5px; }
      .dieline { stroke: #e2e8f0; stroke-width: 0.5; stroke-dasharray: 2, 2; }
    </style>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A37" />
      <stop offset="50%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#B7791F" />
    </linearGradient>
    <!-- Deep Emerald Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A4D3C" />
      <stop offset="100%" stop-color="#052E24" />
    </linearGradient>
  </defs>

  <!-- Background White Upper Section -->
  <rect x="0" y="0" width="190" height="280" fill="#FFFFFF" />

  <!-- Top Heat Seal Zone (15mm) - No ziplock -->
  <rect x="0" y="0" width="190" height="15" fill="#F8FAFC" />
  <line x1="0" y1="15" x2="190" y2="15" class="dieline" />
  <text x="95" y="9" font-family="Arial" font-size="3" fill="#94A3B8" text-anchor="middle" letter-spacing="1">TOP HEAT SEAL ZONE (15mm)</text>

  <!-- Bottom Emerald Green Section -->
  <path d="M0,175 Q95,160 190,175 L190,280 L0,280 Z" fill="url(#greenGrad)" />
  <!-- Gold Wave Border -->
  <path d="M0,175 Q95,160 190,175" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" />

  <!-- ================= LOGO SECTION ================= -->
  <g transform="translate(95, 42)">
    <!-- Golden Pulse Seed & Green Leaf Emblem -->
    <g transform="translate(0, -6) scale(0.27)">
      <!-- Golden Pulse Grain Seed -->
      <ellipse cx="0" cy="0" rx="28" ry="34" fill="url(#goldGrad)"/>
      <path d="M-14,-22 C-4,-8 -4,10 -14,24" stroke="#B7791F" stroke-width="3" fill="none" opacity="0.6"/>
      <ellipse cx="9" cy="-10" rx="6" ry="10" fill="#FFF8DC" opacity="0.45"/>
      <path d="M2,-34 C-6,-58 18,-74 40,-66 C40,-46 22,-34 2,-34 Z" fill="#2E7D32"/>
      <path d="M4,-36 C14,-48 24,-56 36,-64" stroke="#A7F3D0" stroke-width="1.5" fill="none"/>
    </g>

    
    <text x="3" y="16" class="brand-title" fill="#0A4D3C" text-anchor="end">SPICO</text><text x="6" y="16" class="brand-vita" fill="#D49A37">Vita</text>

    <!-- Tagline -->
    <text x="0" y="24" class="tagline" fill="#D49A37" text-anchor="middle">PURITY IN EVERY GRAIN</text>
  </g>

  <!-- ================= CENTRAL TRANSPARENT WINDOW ================= -->
  <!-- 80mm Diameter Circular Window for Dal Inspection -->
  <g transform="translate(95, 115)">
    <!-- Outer Gold Ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Transparent Window Cutout (Knockout in Print Cylinder) -->
    <circle cx="0" cy="0" r="38" fill="#FFFBEB" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="2,2" />
    
    <!-- Window Label for Printing Plate -->
    <text x="0" y="-8" font-family="Arial" font-size="3.5" font-weight="bold" fill="#B45309" text-anchor="middle">TRANSPARENT WINDOW</text>
    <text x="0" y="-3" font-family="Arial" font-size="2.8" fill="#D97706" text-anchor="middle">(Clear PET Knockout Layer)</text>
    <text x="0" y="5" font-family="Arial" font-size="3" fill="#92400E" text-anchor="middle">Toor Dal Visible Inside</text>
    
    <!-- Quality Stamp Badge -->
    <rect x="-24" y="32" width="48" height="7" rx="3.5" fill="#FFFFFF" stroke="#0A4D3C" stroke-width="0.8" />
    <text x="0" y="36.8" font-family="Arial" font-size="3.2" font-weight="bold" fill="#0A4D3C" text-anchor="middle">100% VISIBLE QUALITY</text>
  </g>

  <!-- ================= PRODUCT TITLE & BADGES ================= -->
  <g transform="translate(95, 192)">
    <text x="0" y="0" class="prod-sub" fill="#A7F3D0" text-anchor="middle">NATURAL &amp; WHOLESOME</text>
    <text x="0" y="10" class="prod-name" fill="#FDE047" text-anchor="middle">Premium Unpolished Toor Dal</text>
    
    <!-- USPs Badges -->
    <g transform="translate(0, 18)">
      <rect x="-42" y="0" width="38" height="6" rx="3" fill="#063E30" stroke="#0D735A" stroke-width="0.6" />
      <path d="M-40,3 l1.2,1.2 l2.3,-2.5" stroke="#FDE047" stroke-width="0.6" fill="none"/><text x="-20.5" y="4.2" class="badge-txt" fill="#E6FFFA" text-anchor="middle">100% Unpolished</text>

      <rect x="4" y="0" width="38" height="6" rx="3" fill="#063E30" stroke="#0D735A" stroke-width="0.6" />
      <path d="M6,3 l1.2,1.2 l2.3,-2.5" stroke="#FDE047" stroke-width="0.6" fill="none"/><text x="25.5" y="4.2" class="badge-txt" fill="#E6FFFA" text-anchor="middle">Sortex Cleaned</text>
    </g>
  </g>

  <!-- ================= BOTTOM REGULATORY STRIP ================= -->
  <g transform="translate(18, 248)">
    <!-- Veg Symbol -->
    <rect x="0" y="0" width="7" height="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="0.7" rx="0.5" />
    <circle cx="3.5" cy="3.5" r="2" fill="#22C55E" />
    <text x="9.5" y="5" font-family="Arial" font-size="3" font-weight="bold" fill="#A7F3D0">100% VEG</text>

    <!-- Net Quantity -->
    <g transform="translate(142, 0)">
      <text x="12" y="0" class="qty-lbl" fill="#A7F3D0" text-anchor="end">NET QUANTITY</text>
      <text x="12" y="7" class="qty-val" fill="#FFFFFF" text-anchor="end">1 kg</text>
    </g>
  </g>

  <!-- Bottom Heat Seal Zone (15mm) -->
  <line x1="0" y1="265" x2="190" y2="265" class="dieline" />
  <rect x="0" y="265" width="190" height="15" fill="#031F18" opacity="0.4" />
  <text x="95" y="274" font-family="Arial" font-size="3" fill="#A7F3D0" opacity="0.6" text-anchor="middle" letter-spacing="1">BOTTOM HEAT SEAL ZONE (15mm)</text>

  <!-- Outer Cut Border (Dieline 190x280mm) -->
  <rect x="0" y="0" width="190" height="280" fill="none" stroke="#CBD5E1" stroke-width="0.8" />
</svg>
