<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 280" width="190mm" height="280mm">
  <defs>
    <style>
      .brand-title { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 900; font-size: 13px; }
      .brand-vita { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-style: italic; font-size: 13px; }
      .tagline { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; font-size: 3.8px; letter-spacing: 1.4px; }
      .story-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 3.2px; line-height: 4.8px; }
      .tbl-hdr { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 3.6px; text-transform: uppercase; }
      .tbl-txt { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 3.2px; }
      .batch-lbl { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; font-size: 3.2px; }
      .batch-val { font-family: 'Courier New', monospace; font-size: 3.3px; }
      .legal-hdr { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 3.2px; text-transform: uppercase; }
      .legal-txt { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 2.8px; }
      .dieline { stroke: #e2e8f0; stroke-width: 0.5; stroke-dasharray: 2, 2; }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A37" />
      <stop offset="50%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#B7791F" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A4D3C" />
      <stop offset="100%" stop-color="#052E24" />
    </linearGradient>
  </defs>

  <!-- Background White Base -->
  <rect x="0" y="0" width="190" height="280" fill="#FFFFFF" />

  <!-- Top Heat Seal Zone (15mm) - Exact match to front, no ziplock -->
  <rect x="0" y="0" width="190" height="15" fill="#F8FAFC" />
  <line x1="0" y1="15" x2="190" y2="15" class="dieline" />
  <text x="95" y="9" font-family="Arial" font-size="3" fill="#94A3B8" text-anchor="middle" letter-spacing="1">TOP HEAT SEAL ZONE (15mm)</text>

  <!-- ================= HEADER SECTION ================= -->
  <rect x="0" y="15" width="190" height="42" fill="url(#greenGrad)" />
  <line x1="0" y1="57" x2="190" y2="57" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Header Logo & Brand Promise -->
  <g transform="translate(15, 23)">
    <!-- Golden Pulse Seed & Green Leaf Emblem -->
    <g transform="translate(10, 8) scale(0.22)">
      <ellipse cx="0" cy="0" rx="28" ry="34" fill="url(#goldGrad)"/>
      <path d="M-14,-22 C-4,-8 -4,10 -14,24" stroke="#B7791F" stroke-width="3" fill="none" opacity="0.6"/>
      <ellipse cx="9" cy="-10" rx="6" ry="10" fill="#FFF8DC" opacity="0.45"/>
      <path d="M2,-34 C-6,-58 18,-74 40,-66 C40,-46 22,-34 2,-34 Z" fill="#2E7D32"/>
      <path d="M4,-36 C14,-48 24,-56 36,-64" stroke="#A7F3D0" stroke-width="1.5" fill="none"/>
    </g>

    
    <text x="24" y="9" class="brand-title" fill="#FFFFFF">SPICO</text><text x="67" y="9" class="brand-vita" fill="#D49A37">Vita</text>
    <text x="24" y="14.5" class="tagline" fill="#A7F3D0">PURITY IN EVERY GRAIN</text>

    <!-- Veg Badge -->
    <g transform="translate(142, 3)">
      <rect x="0" y="0" width="5.5" height="5.5" fill="#FFFFFF" stroke="#22C55E" stroke-width="0.6" rx="0.5" />
      <circle cx="2.75" cy="2.75" r="1.5" fill="#22C55E" />
      <text x="7" y="4" font-family="Arial" font-size="2.6" font-weight="bold" fill="#A7F3D0">100% VEG</text>
    </g>

    <!-- Short Brand Story -->
    <text x="0" y="24" class="story-text" fill="#ECFDF5">
      At SPICO Vita, we source unpolished pulses directly from trusted farmlands. Multi-stage
    </text>
    <text x="0" y="28.5" class="story-text" fill="#ECFDF5">
      Sortex cleaned to preserve natural protein, dietary fiber, and authentic village aroma.
    </text>
  </g>

  <!-- ================= 4 PILLARS BADGES ================= -->
  <g transform="translate(15, 63)">
    <!-- 1. Unpolished -->
    <rect x="0" y="0" width="37" height="11" rx="2" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="0.5" />
    <g transform="translate(18.5,2.6)" stroke="#065F46" stroke-width="0.4" fill="#D49A37"><line x1="0" y1="2.2" x2="0" y2="-1.8"/><ellipse cx="-0.8" cy="-0.6" rx="0.5" ry="0.9"/><ellipse cx="0.8" cy="-0.6" rx="0.5" ry="0.9"/><ellipse cx="0" cy="-1.9" rx="0.5" ry="0.9"/></g>
    <text x="18.5" y="8.5" font-family="Arial" font-size="2.6" font-weight="bold" fill="#065F46" text-anchor="middle">100% Unpolished</text>

    <!-- 2. Sortex Cleaned -->
    <rect x="41" y="0" width="37" height="11" rx="2" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="0.5" />
    <path transform="translate(59.5,2.6)" d="M0,-2 L0.5,-0.5 L2,0 L0.5,0.5 L0,2 L-0.5,0.5 L-2,0 L-0.5,-0.5 Z" fill="#D49A37"/>
    <text x="59.5" y="8.5" font-family="Arial" font-size="2.6" font-weight="bold" fill="#065F46" text-anchor="middle">Sortex Cleaned</text>

    <!-- 3. High Protein -->
    <rect x="82" y="0" width="37" height="11" rx="2" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="0.5" />
    <g transform="translate(100.5,2.6)"><ellipse cx="0" cy="0" rx="1.6" ry="2" fill="#D49A37"/><text x="0" y="0.9" font-family="Arial" font-size="2.2" font-weight="bold" fill="#065F46" text-anchor="middle">P</text></g>
    <text x="100.5" y="8.5" font-family="Arial" font-size="2.6" font-weight="bold" fill="#065F46" text-anchor="middle">High Protein</text>

    <!-- 4. Zero Polish -->
    <rect x="123" y="0" width="37" height="11" rx="2" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="0.5" />
    <g transform="translate(141.5,2.6)"><path d="M0,-2 C1.5,-0.2 1.6,0.6 1.6,1 A1.6,1.6 0 0 1 -1.6,1 C-1.6,0.6 -1.5,-0.2 0,-2 Z" fill="#D49A37"/><line x1="-2" y1="2" x2="2" y2="-2" stroke="#B91C1C" stroke-width="0.5"/></g>
    <text x="141.5" y="8.5" font-family="Arial" font-size="2.3" font-weight="bold" fill="#065F46" text-anchor="middle">No Added Oil or Polish</text>
  </g>

  <!-- ================= NUTRITION & COOKING GRID ================= -->
  <g transform="translate(15, 80)">
    <!-- NUTRITION TABLE (Left Box) -->
    <rect x="0" y="0" width="76" height="52" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6" />
    <text x="6" y="7" class="tbl-hdr" fill="#0A4D3C">NUTRITIONAL INFORMATION</text>
    <text x="6" y="11" font-family="Arial" font-size="2.4" fill="#64748B">Per 100 g  |  </text><text x="23" y="11" font-family="Arial" font-size="2.3" font-weight="bold" fill="#B91C1C">PLACEHOLDER: values to be updated per lab report</text>
    <line x1="6" y1="13" x2="70" y2="13" stroke="#CBD5E1" stroke-width="0.4" />

    <text x="6" y="19" class="tbl-txt" font-weight="bold" fill="#1E293B">Energy</text>
    <text x="70" y="19" class="tbl-txt" font-weight="bold" fill="#0A4D3C" text-anchor="end">343 kcal</text>

    <text x="6" y="25" class="tbl-txt" font-weight="bold" fill="#1E293B">Protein</text>
    <text x="70" y="25" class="tbl-txt" font-weight="bold" fill="#0A4D3C" text-anchor="end">22.3 g</text>

    <text x="6" y="31" class="tbl-txt" fill="#475569">Carbohydrates</text>
    <text x="70" y="31" class="tbl-txt" fill="#1E293B" text-anchor="end">62.8 g</text>

    <text x="6" y="37" class="tbl-txt" fill="#475569">Dietary Fiber</text>
    <text x="70" y="37" class="tbl-txt" fill="#1E293B" text-anchor="end">15.0 g</text>

    <text x="6" y="43" class="tbl-txt" fill="#475569">Total Fat</text>
    <text x="70" y="43" class="tbl-txt" fill="#1E293B" text-anchor="end">1.5 g</text>

    <text x="6" y="49" class="tbl-txt" fill="#475569">Cholesterol</text>
    <text x="70" y="49" class="tbl-txt" fill="#1E293B" text-anchor="end">0 mg</text>

    <!-- COOKING GUIDE (Right Box) -->
    <rect x="84" y="0" width="76" height="52" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.6" />
    <text x="90" y="7" class="tbl-hdr" fill="#065F46">HOW TO COOK</text>
    <line x1="90" y1="10" x2="154" y2="10" stroke="#A7F3D0" stroke-width="0.4" />

    <!-- Step 1 -->
    <circle cx="94" cy="17" r="2.5" fill="#0A4D3C" />
    <text x="94" y="18" font-family="Arial" font-size="2.6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="99" y="16.5" class="tbl-txt" fill="#1E293B">Rinse 1 cup dal thoroughly</text>
    <text x="99" y="19.5" font-family="Arial" font-size="2.4" fill="#64748B">in clean running water.</text>

    <!-- Step 2 -->
    <circle cx="94" cy="27" r="2.5" fill="#0A4D3C" />
    <text x="94" y="28" font-family="Arial" font-size="2.6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="99" y="26.5" class="tbl-txt" fill="#1E293B">Add 3 cups water &amp; haldi</text>
    <text x="99" y="29.5" font-family="Arial" font-size="2.4" fill="#64748B">into pressure cooker.</text>

    <!-- Step 3 -->
    <circle cx="94" cy="37" r="2.5" fill="#0A4D3C" />
    <text x="94" y="38" font-family="Arial" font-size="2.6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="99" y="36.5" class="tbl-txt" fill="#1E293B">Cook for 4-5 whistles.</text>
    <text x="99" y="39.5" font-family="Arial" font-size="2.4" fill="#64748B">Temper with ghee &amp; cumin.</text>

    <!-- Tip bar -->
    <rect x="88" y="44" width="68" height="5.5" rx="1.5" fill="#D1FAE5" />
    <text x="122" y="48" font-family="Arial" font-size="2.4" font-weight="bold" fill="#065F46" text-anchor="middle">Tip: Soak 20 mins for faster cooking!</text>
  </g>

  <!-- ================= LEGAL METROLOGY BATCH CODING BOX ================= -->
  <!-- Reserved white knockout rectangle for online inkjet coding -->
  <g transform="translate(15, 138)">
    <rect x="0" y="0" width="160" height="26" rx="2.5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2,2" />
    
    <text x="5" y="5" font-family="Arial" font-size="2.4" font-weight="bold" fill="#64748B" letter-spacing="0.5">LEGAL METROLOGY MANDATORY DECLARATIONS (BATCH STAMP BOX)</text>
    <line x1="5" y1="7" x2="155" y2="7" stroke="#E2E8F0" stroke-width="0.5" />

    <text x="5" y="13" class="batch-lbl" fill="#475569">BATCH NO:</text>
    <text x="32" y="13" class="batch-val" font-weight="bold" fill="#0F172A">SPV/TD/2601</text>

    <text x="85" y="13" class="batch-lbl" fill="#475569">NET QTY:</text>
    <text x="110" y="13" class="batch-val" font-weight="bold" fill="#0F172A">1 kg</text>

    <text x="5" y="18" class="batch-lbl" fill="#475569">PACKED ON:</text>
    <text x="32" y="18" class="batch-val" fill="#0F172A">09/10/2026</text>

    <text x="85" y="18" class="batch-lbl" fill="#475569">BEST BEFORE:</text>
    <text x="115" y="18" class="batch-val" fill="#0F172A">6 MONTHS FROM PKG</text>

    <line x1="5" y1="20" x2="155" y2="20" stroke="#E2E8F0" stroke-width="0.5" />
    <text x="5" y="24.5" class="batch-lbl" font-weight="bold" fill="#0F172A">MRP: ₹200.00</text>
    <text x="36" y="24.5" font-family="Arial" font-size="2.4" fill="#64748B">(Inclusive of all taxes)</text>
    <text x="85" y="24.5" class="batch-lbl" fill="#0A4D3C">UNIT SALE PRICE: ₹200.00 per kg</text>
  </g>

  <!-- ================= FSSAI & PACKER DETAILS ================= -->
  <g transform="translate(15, 170)">
    <!-- Left: FSSAI + Addresses -->
    <g>
      <rect x="0" y="0" width="13" height="5.5" rx="0.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="0.6" />
      <text x="6.5" y="4" font-family="Arial" font-size="3.2" font-weight="900" fill="#0F172A" text-anchor="middle">fssai</text>
      <text x="16" y="4.2" font-family="Courier New" font-size="3.2" font-weight="bold" fill="#0F172A">Reg. No. 21226194003349</text>
      <text x="0" y="11.5" class="legal-hdr" fill="#0F172A">MARKETED BY:</text>
      <text x="0" y="15.5" font-family="Arial" font-size="3" font-weight="bold" fill="#0A4D3C">Tinku Krishnan C/o SPICO Vita</text>
      <text x="0" y="19" class="legal-txt" fill="#64748B">No. 32/2, 34/1, Kadabisanahalli, BTM Layout,</text>
      <text x="0" y="22.3" class="legal-txt" fill="#64748B">Bengaluru, Karnataka - 560087</text>
      <text x="0" y="28.5" class="legal-hdr" fill="#0F172A">PACKED BY:</text>
      <rect x="0" y="30" width="84" height="12.5" rx="1" fill="#FEF3C7" stroke="#D97706" stroke-width="0.4" stroke-dasharray="1,1"/>
      <text x="2" y="33.5" class="legal-txt" fill="#92400E">[Repacker name - PLACEHOLDER]</text>
      <text x="2" y="37" class="legal-txt" fill="#92400E">[Repacker full address - PLACEHOLDER]</text>
      <text x="2" y="40.5" class="legal-txt" fill="#92400E">FSSAI Lic. No. [repacker licence - PLACEHOLDER]</text>
      <text x="0" y="47.5" font-family="Arial" font-size="3" font-weight="bold" fill="#0F172A">Country of Origin: India</text>
    </g>

    <!-- Right: Consumer Care + Barcode -->
    <g transform="translate(90, 0)">
      <!-- Consumer Care Box -->
      <rect x="0" y="0" width="70" height="20" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6" />
      <text x="5" y="4.5" class="legal-hdr" fill="#065F46">CONSUMER CARE CELL</text>
      <text x="5" y="8" font-family="Arial" font-size="2.4" fill="#64748B">For feedback or queries, contact executive at:</text>
      <path d="M5.3,9.8 l0.8,-0.3 l0.6,1 l-0.5,0.4 a3,3 0 0 0 1.2,1.2 l0.4,-0.5 l1,0.6 l-0.3,0.8 a4,4 0 0 1 -3.2,-3.2z" fill="#0A4D3C"/><text x="10" y="12" font-family="Arial" font-size="2.8" font-weight="bold" fill="#1E293B">+91 98450 XXXXX</text>
      <rect x="5.2" y="13.2" width="3.6" height="2.4" fill="none" stroke="#0A4D3C" stroke-width="0.35"/><path d="M5.2,13.2 l1.8,1.3 l1.8,-1.3" fill="none" stroke="#0A4D3C" stroke-width="0.35"/><text x="10" y="15.5" font-family="Arial" font-size="2.8" font-weight="bold" fill="#0A4D3C">care@spicovita.com</text>
      <text x="5" y="18.5" font-family="Arial" font-size="2.2" fill="#94A3B8">www.spicovita.com</text>

      <!-- GS1 Barcode Box -->
      <g transform="translate(5, 23)">
        <rect x="0" y="0" width="60" height="15" rx="1" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5" />
        <g opacity="0.3"><line x1="5" y1="2" x2="5" y2="10" stroke="#000" stroke-width="0.8" />
        <line x1="8" y1="2" x2="8" y2="10" stroke="#000" stroke-width="0.4" />
        <line x1="11" y1="2" x2="11" y2="10" stroke="#000" stroke-width="1" />
        <line x1="14" y1="2" x2="14" y2="10" stroke="#000" stroke-width="0.5" />
        <line x1="18" y1="2" x2="18" y2="10" stroke="#000" stroke-width="0.8" />
        <line x1="21" y1="2" x2="21" y2="10" stroke="#000" stroke-width="0.5" />
        <line x1="25" y1="2" x2="25" y2="10" stroke="#000" stroke-width="1.2" />
        <line x1="29" y1="2" x2="29" y2="10" stroke="#000" stroke-width="0.6" />
        <line x1="33" y1="2" x2="33" y2="10" stroke="#000" stroke-width="0.8" />
        <line x1="37" y1="2" x2="37" y2="10" stroke="#000" stroke-width="0.5" />
        <line x1="41" y1="2" x2="41" y2="10" stroke="#000" stroke-width="1" />
        <line x1="45" y1="2" x2="45" y2="10" stroke="#000" stroke-width="0.7" />
        <line x1="49" y1="2" x2="49" y2="10" stroke="#000" stroke-width="0.9" />
        <line x1="54" y1="2" x2="54" y2="10" stroke="#000" stroke-width="0.6" /></g>
        <text x="30" y="13.5" font-family="Courier New" font-size="2.6" font-weight="bold" fill="#000" text-anchor="middle">GS1 barcode placeholder</text>
      </g>
    </g>
  </g>

  <!-- ================= STORAGE ADVISORY & RECYCLE ================= -->
  <g transform="translate(15, 252)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#E2E8F0" stroke-width="0.5" />
    <rect x="0" y="3.4" width="3" height="3" fill="none" stroke="#64748B" stroke-width="0.35"/><line x1="0" y1="4.4" x2="3" y2="4.4" stroke="#64748B" stroke-width="0.35"/><text x="4.5" y="6" class="legal-txt" fill="#64748B">Store in a cool, dry place. Transfer to an airtight container after opening.</text>
    <g transform="translate(122,4.8)" fill="none" stroke="#0A4D3C" stroke-width="0.4"><path d="M-1.5,1 L0,-1.5 L1.5,1 Z"/><path d="M-0.5,-1.5 l0.5,-0.5 l0.3,0.6" /></g><text x="160" y="6" font-family="Arial" font-size="2.6" font-weight="bold" fill="#0A4D3C" text-anchor="end">KEEP YOUR CITY CLEAN</text>
  </g>

  <!-- Bottom Heat Seal Zone (15mm) - Exact match to front -->
  <line x1="0" y1="265" x2="190" y2="265" class="dieline" />
  <rect x="0" y="265" width="190" height="15" fill="#F8FAFC" />
  <text x="95" y="274" font-family="Arial" font-size="3" fill="#94A3B8" text-anchor="middle" letter-spacing="1">BOTTOM HEAT SEAL ZONE (15mm)</text>

  <!-- Outer Cut Border (Dieline 190x280mm) -->
  <rect x="0" y="0" width="190" height="280" fill="none" stroke="#CBD5E1" stroke-width="0.8" />
</svg>
